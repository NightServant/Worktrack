# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "Worktrack"

[api]
enabled = true
# Port to use for the API URL.
port = 54321
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure. Limits payload size
# for accidental or malicious requests.
max_rows = 1000

[api.tls]
# Enable HTTPS endpoints locally using a self-signed certificate.
enabled = false
# Paths to self-signed certificate pair.
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54322
# Port used by db diff command to initialize the shadow database.
shadow_port = 54320
# Maximum amount of time to wait for health check when starting the local database.
health_timeout = "2m"
# The database major version to use. This has to be the same as your remote database's. Run `SHOW
# server_version;` on the remote database to check.
major_version = 17

[db.pooler]
enabled = false
# Port to use for the local connection pooler.
port = 54329
# Specifies when a server connection can be reused by other clients.
# Configure one of the supported pooler modes: `transaction`, `session`.
pool_mode = "transaction"
# How many server connections to allow per user/database pair.
default_pool_size = 20
# Maximum number of client connections allowed.
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
# If disabled, migrations will be skipped during a db push or reset.
enabled = true
# Specifies an ordered list of schema files that describe your database.
# Supports glob patterns relative to supabase directory: "./schemas/*.sql"
schema_paths = []

[db.seed]
# If enabled, seeds the database after migrations during a db reset.
enabled = true
# Specifies an ordered list of seed files to load during db reset.
# Supports glob patterns relative to supabase directory: "./seeds/*.sql"
sql_paths = ["./seed.sql"]

[db.network_restrictions]
# Enable management of network restrictions.
enabled = false
# List of IPv4 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv4 connections. Set empty array to block all IPs.
allowed_cidrs = ["0.0.0.0/0"]
# List of IPv6 CIDR blocks allowed to connect to the database.
# Defaults to allow all IPv6 connections. Set empty array to block all IPs.
allowed_cidrs_v6 = ["::/0"]

# Uncomment to reject non-secure connections to the database.
# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# Bind realtime via either IPv4 or IPv6. (default: IPv4)
# ip_version = "IPv6"
# The maximum length in bytes of HTTP request headers. (default: 4096)
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54323
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
# OpenAI API Key to use for Supabase AI in the Supabase Studio.
openai_api_key = "env(OPENAI_API_KEY)"

# Email testing server. Emails sent with the local dev setup are not actually sent - rather, they
# are monitored, and you can view the emails that would have been sent from the web interface.
[inbucket]
enabled = true
# Port to use for the email testing server web interface.
port = 54324
# Uncomment to expose additional ports for testing user applications that send emails.
# smtp_port = 54325
# pop3_port = 54326
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
# The maximum file size allowed (e.g. "5MB", "500KB").
file_size_limit = "50MiB"

# Uncomment to configure local storage buckets
# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

# Allow connections via S3 compatible clients
[storage.s3_protocol]
enabled = true

# Image transformation API is available to Supabase Pro plan.
# [storage.image_transformation]
# enabled = true

# Store analytical data in S3 for running ETL jobs over Iceberg Catalog
# This feature is only available on the hosted platform.
[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

# Analytics Buckets is available to Supabase Pro plan.
# [storage.analytics.buckets.my-warehouse]

# Store vector embeddings in S3 for large and durable datasets
# This feature is only available on the hosted platform.
[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

# Vector Buckets is available to Supabase Pro plan.
# [storage.vector.buckets.documents-openai]

[auth]
enabled = true
# The base URL of your website. Used as an allow-list for redirects and for constructing URLs used
# in emails.
#
# READ THIS BEFORE RUNNING `supabase config push`. This file is generated from
# CLI DEFAULTS, and `config push` sends the WHOLE file -- so any value left at
# its default overwrites whatever the dashboard currently has. site_url is the
# one that bites: pushing "http://127.0.0.1:3000" to the live project points
# every auth email and OAuth return at the developer's laptop.
#
# So it is env-driven and has no literal fallback. `config push` fails loudly
# on an unset variable, which is the correct outcome -- far better than
# silently pushing localhost to production.
site_url = "env(SUPABASE_AUTH_SITE_URL)"
# The public URL that Auth serves on. Defaults to the API external URL with `/auth/v1` appended.
# external_url = ""
# A list of *exact* URLs that auth providers are permitted to redirect to post authentication.
# EVERY ENTRY ENDS IN `/**`, AND THE BARE ORIGINS THAT USED TO BE HERE WERE
# WRONG. These are matched as patterns against the WHOLE redirect URL, path
# included, and the app sends `${origin}/overview` -- so a bare
# `https://worktrack-jobs.vercel.app` matches nothing the app ever asks for.
# It would have pushed cleanly and rejected every return.
#
# The `/**` is also why the 2026-09-19 route rename needed nothing here: a
# pattern that matches any path matched the new one already. Had these been
# exact paths, renaming `/dashboard` would have broken every auth return
# silently and remotely, which is the failure this wildcard was chosen to make
# impossible.
#
# THE OLD DOMAIN IS LISTED ON PURPOSE. It still resolves, still serves, and is
# what existing links point at; a Vercel project may hold several .vercel.app
# domains at no cost. Dropping it here is the one genuinely breaking edit in
# the whole rename.
#
# Hardcoded rather than `env(SUPABASE_AUTH_SITE_URL)` because this list has to
# name MORE than the current site: the previous domain and localhost are not
# derivable from it, and interpolating one origin is what silently reduced this
# to a single entry before.
additional_redirect_urls = [
  "https://worktrack-jobs.vercel.app/**",
  "https://job-search-tracker-analytics-dashbo-one.vercel.app/**",
  "http://localhost:3000/**",
]
# How long tokens are valid for, in seconds. Defaults to 3600 (1 hour), maximum 604,800 (1 week).
jwt_expiry = 3600
# JWT issuer URL. If not set, defaults to auth.external_url.
# jwt_issuer = ""
# Path to JWT signing key. DO NOT commit your signing keys file to git.
# signing_keys_path = "./signing_keys.json"
# If disabled, the refresh token will never expire.
enable_refresh_token_rotation = true
# Allows refresh tokens to be reused after expiry, up to the specified interval in seconds.
# Requires enable_refresh_token_rotation = true.
refresh_token_reuse_interval = 10
# Allow/disallow new user signups to your project.
enable_signup = true
# Allow/disallow anonymous sign-ins to your project.
enable_anonymous_sign_ins = false
# Allow/disallow testing manual linking of accounts
enable_manual_linking = false
# Passwords shorter than this value will be rejected as weak. Minimum 6, recommended 8 or more.
# 10, matching PASSWORD_MIN_LENGTH in src/lib/credentials.ts. docs/SECURITY.md
# listed "client-side validation is duplicated by nothing on the server" as
# still open; these two lines are what close it for the password rules. A rule
# the browser enforces and the server does not is a rule anyone can skip with
# curl.
minimum_password_length = 10
# Passwords that do not meet the following requirements will be rejected as weak. Supported values
# are: `letters_digits`, `lower_upper_letters_digits`, `lower_upper_letters_digits_symbols`
password_requirements = "lower_upper_letters_digits_symbols"
# LEAKED-PASSWORD PROTECTION IS NOT CONFIGURABLE FROM THIS FILE, and the way
# that was discovered is worth keeping. `password_hibp_enabled` is a real
# Supabase setting -- checking a new password against HaveIBeenPwned by
# k-anonymity, so only the first five characters of the SHA-1 hash leave the
# server -- and the string IS in the CLI binary. It is there as `json:` only:
# it is a Management API field, with no `toml:` tag, so config.toml has no key
# for it. The four it does accept are `minimum_password_length`,
# `password_requirements`, `password_verification_attempt` and
# `secure_password_change`.
#
# Writing it here anyway did not fail on that line. `supabase db push` PARSES
# THE WHOLE CONFIG FIRST, so one unknown key aborted the command before it
# looked at a single migration -- the same blast radius as the Pro-only
# `[auth.sessions]` block below, from a different cause.
#
# AND IT IS PRO-ONLY ANYWAY, which is the part that actually settles it. The
# toggle renders at Authentication -> Sign In / Providers -> Email and refuses
# to save on the free tier: "Configuring leaked password protection via
# HaveIBeenPwned.org is available on Pro Plans and up." (2026-09-19.) So this
# is the SECOND Pro-gated auth setting on this project, after [auth.sessions]
# below -- and unlike that one it cannot even be written here to wait for an
# upgrade, because the key does not exist in this CLI.
#
# THE GAP IS REAL AND IS NOT WORTH FAKING. The length and character rules above
# stop a lazy password; only this stops one that is already on a list, and
# `Tr0ub4dor&3` satisfies both rules and is breached. A client-side call to the
# Pwned Passwords API would look like the same control and would not be one --
# anyone who does not run our client skips it -- which is the objection this
# repo already makes about lib/authRateLimit. The database linter reports this
# as disabled, and that report is accurate.

# Configure passkey sign-ins.
# [auth.passkey]
# enabled = false

# Configure WebAuthn relying party settings (required when passkey is enabled).
# [auth.webauthn]
# rp_display_name = "Supabase"
# rp_id = "localhost"
# rp_origins = ["http://127.0.0.1:3000"]

[auth.rate_limit]
# Number of emails that can be sent per hour. Requires auth.email.smtp to be enabled.
# 30, not the CLI's 2. Two an hour is the built-in provider's cap and it is a
# throttle on the PROJECT, not per user -- with a real signup flow behind it,
# the third person to register in an hour silently gets no code. 30 is still a
# real ceiling against a flood while leaving ordinary use alone; Resend's free
# tier allows far more.
email_sent = 30
# Number of SMS messages that can be sent per hour. Requires auth.sms to be enabled.
sms_sent = 30
# Number of anonymous sign-ins that can be made per hour per IP address. Requires enable_anonymous_sign_ins = true.
anonymous_users = 30
# Number of sessions that can be refreshed in a 5 minute interval per IP address.
token_refresh = 150
# Number of sign up and sign-in requests that can be made in a 5 minute interval per IP address (excludes anonymous users).
sign_in_sign_ups = 30
# Number of OTP / Magic link verifications that can be made in a 5 minute interval per IP address.
token_verifications = 30
# Number of Web3 logins that can be made in a 5 minute interval per IP address.
web3 = 30

# CAPTCHA IS THE ONE REMAINING BOT DEFENCE AND IT IS NOT ENABLED HERE.
#
# STATED PLAINLY BECAUSE THE ALTERNATIVE IS PRETENDING. The brief asks to
# "prevent automated scripts and harmful users from exploiting your system",
# and what this repo has is: `[auth.rate_limit]` above, which is a real
# server-side ceiling per IP; a per-user throttle on the two routes that spend
# money; and `lib/authRateLimit`, which its own docblock calls "an affordance,
# not a boundary" because it runs in the browser. None of those stops a
# distributed sign-up flood, and no amount of code in this repository can --
# the auth endpoint is Supabase's, not ours, so the only place the check can
# live is here.
#
# IT IS COMMENTED OUT because turning it on needs a `secret` that must not be
# in this file, and a matching site key wired into the sign-up and sign-in
# forms. That is a deployment decision with a credential attached, not a code
# change, and half of it -- a config that demands a token the forms do not
# send -- would lock everybody out of registration.
#
# TO ENABLE: get a Cloudflare Turnstile key pair, put the secret in the
# dashboard (never here), uncomment this block, and pass
# `options: { captchaToken }` to signUp/signInWithPassword in AuthContext.
# Then `npm run push:auth-config`.
#
# Configure one of the supported captcha providers: `hcaptcha`, `turnstile`.
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = ""

[auth.email]
# Allow/disallow new user signups via email to your project.
enable_signup = true
# If enabled, a user will be required to confirm any email change on both the old, and new email
# addresses. If disabled, only the new email is required to confirm.
double_confirm_changes = true
# If enabled, users need to confirm their email address before signing in.
# ON. This is the switch that makes the registration flow's step 2 real: with
# it off, signUp() returns a usable session immediately and the OTP screen is
# theatre in front of an account that already exists.
enable_confirmations = true
# If enabled, users will need to reauthenticate or have logged in recently to change their password.
secure_password_change = false
# Controls the minimum amount of time that must pass before sending another signup confirmation or password reset email.
# 60s, not the CLI's 1s. This is a SERVER-SIDE limit and therefore a real one,
# unlike lib/authRateLimit which is candid about being a client affordance. The
# OTP screen's "resend" button is one click, and at 1s apiece a held key is a
# mail flood billed to us and delivered to someone else's inbox.
max_frequency = "60s"
# Number of characters used in the email OTP.
otp_length = 6
# Number of seconds before the email OTP expires (defaults to 1 hour).
# 600 (10 MINUTES), NOT THE HOUR THIS INHERITED (2026-09-15). This one number
# governs the sign-up confirmation code AND the password-reset code, and both
# are single-factor: whoever holds the code holds the account. An hour is the
# window in which a forwarded email, a shared screen, a synced notification on
# a second device or a mailbox somebody else can read is still a live key.
#
# Supabase's own security advisor flags anything above 3600 and recommends
# under an hour; ten minutes is the interval a person who asked for a code
# actually uses -- they are looking at their inbox when they ask.
#
# IT COSTS A RESEND, and that is the trade being made deliberately. Somebody
# who requests a reset and comes back after lunch types a dead code and has to
# press resend; `max_frequency` below allows that after 60 seconds. A minute of
# friction against fifty minutes of a live credential sitting in an inbox.
otp_expiry = 600

# CUSTOM SMTP, VIA RESEND. Two things depend on this block, and only one of
# them is about deliverability.
#
# The obvious one: Supabase's built-in email provider is rate limited to a
# couple of messages an hour and is explicitly not for production.
#
# The one that actually blocks this app: the free tier REFUSES EMAIL TEMPLATE
# CHANGES while the default provider is in use. That is what rejected the
# first `config push` on 2026-09-03, and the template it rejected is the only
# thing that puts `{{ .Token }}` in the signup email. Without it the
# registration flow's step 2 waits forever for a code that was never sent. So
# custom SMTP is not a hardening step here, it is what makes the feature work.
#
# `pass` is `env(...)`, never a literal. The key is a bearer credential for an
# account that can send mail as this domain; committing one is the mistake this
# repository's own audit went looking for.
#
# Resend's SMTP username is the literal string "resend" for every account --
# it is not an account id, and it is not the key. Port 465 is implicit TLS,
# which is what Supabase's sender expects.
#
# ADMIN_EMAIL IS THE FROM ADDRESS AND BREVO WILL REJECT ANYTHING UNVERIFIED.
# It must be an address confirmed under Senders in the Brevo dashboard; the
# account's own login address is not automatically one. Currently
# `egabe.cervantes@gmail.com`. It is env-driven so changing sender is a
# variable change rather than a commit, and `scripts/push-auth-config.sh`
# refuses to push a leftover `@resend.dev` value -- that is a real trap, not a
# hypothetical: it sat here as a non-empty string long after Resend was gone.
#
# (The paragraph that used to be here described Resend's shared sender as the
# live setup. It was left in place after the switch and read as current
# configuration, which is exactly how somebody concludes the push did not take.
# The history is below, clearly marked as history.)
# BREVO, NOT RESEND, AND THE REASON IS THE ONE THING THAT WAS BLOCKING REAL
# SIGNUPS (2026-09-15). Gabe: "I am so tired of waiting for the free domain."
#
# THE PROBLEM WAS NEVER OTP. The code flow works and has worked since
# 2026-09-03: a rendered template reached `last_event: delivered`. What did not
# work was WHO it could reach. Resend's shared `onboarding@resend.dev` sender
# delivers ONLY to the Resend account owner, and every other recipient is
# dropped silently -- not bounced, not errored, never delivered. Lifting that
# needs a VERIFIED SENDING DOMAIN, which is what the `worktrack.eu.org` request
# has been waiting on since 2026-09-03 with no queue position and no support
# channel.
#
# BREVO VERIFIES A SENDER ADDRESS RATHER THAN A DOMAIN. Its free tier lets you
# verify one ordinary mailbox -- a Gmail address is fine -- by clicking a link
# sent to it, and from then on you may send to ANY recipient. 300 a day, which
# is two orders of magnitude more than a portfolio project's signups. No DNS,
# no delegation, no waiting on a volunteer reviewer.
#
# THE DOMAIN IS NOW AN UPGRADE, NOT A BLOCKER. When `worktrack.eu.org` lands,
# adding DKIM records to Brevo improves deliverability (fewer spam folders) and
# lets the From address stop being a Gmail one. Nothing about this app has to
# change for that, and nobody is blocked while it is pending.
#
# WHAT TO SET, and neither value belongs in this file:
#   SUPABASE_AUTH_SMTP_USER  the Brevo login email
#   BREVO_SMTP_KEY           an SMTP key from Brevo's dashboard -- NOT the
#                            account password, and not the transactional API
#                            key, which is a different credential
#   SUPABASE_AUTH_SMTP_SENDER  the verified sender address
# Then `npm run push:auth-config`.
#
# PORT 587, NOT 465. Brevo documents 587 with STARTTLS as its primary relay;
# 465 works but several hosts block it outbound, and a port that fails on some
# networks is the same silent-drop failure this block exists to end.
[auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "env(SUPABASE_AUTH_SMTP_USER)"
pass = "env(BREVO_SMTP_KEY)"
admin_email = "env(SUPABASE_AUTH_SMTP_SENDER)"
sender_name = "Worktrack"

# THE TEMPLATE THAT CARRIES THE CODE.
#
# Supabase's stock confirmation email contains {{ .ConfirmationURL }} and no
# token at all, so on the default template no code is ever sent and
# verifyOtp({ type: 'signup' }) fails forever against a code that never
# existed. This block is what replaces it.
#
# It was commented out between the two pushes on 2026-09-03, because the free
# tier rejects template changes while the built-in email provider is in use --
# and the push is ATOMIC, so leaving it in meant nothing at all was applied,
# not even the site_url fix. The [auth.email.smtp] block above lifts that
# restriction, so it is live again.
[auth.email.template.confirmation]
subject = "Your Worktrack verification code"
content_path = "./supabase/templates/confirmation.html"

# THE RECOVERY TEMPLATE IS NOT OPTIONAL FOR A CODE-BASED RESET. Supabase's
# stock version carries {{ .ConfirmationURL }} and no token, so `verifyOtp`
# with `type: 'recovery'` has nothing to verify against and the reset flow
# cannot work at all. Same trap as the confirmation template above.
[auth.email.template.recovery]
subject = "Your Worktrack password reset code"
content_path = "./supabase/templates/recovery.html"

# Uncomment to customize email template
# [auth.email.template.invite]
# subject = "You have been invited"
# content_path = "./supabase/templates/invite.html"

# Uncomment to customize notification email template
# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./templates/password_changed_notification.html"

[auth.sms]
# Allow/disallow new user signups via SMS to your project.
enable_signup = false
# If enabled, users need to confirm their phone number before signing in.
enable_confirmations = false
# Template for sending OTP to users
template = "Your code is {{ .Code }}"
# Controls the minimum amount of time that must pass before sending another sms otp.
max_frequency = "5s"

# Use pre-defined map of phone number to OTP for testing.
# [auth.sms.test_otp]
# 4152127777 = "123456"

# Configure logged in session timeouts.
# SESSIONS EXPIRE ON THE SERVER, NOT ONLY IN THE BROWSER (2026-09-15).
#
# `jwt_expiry = 3600` above is NOT a session expiry and it is worth saying so,
# because the two are easy to confuse. It is how long one access token is good
# for; with refresh-token rotation on, the browser renews it every hour
# forever. So a session on a shared or stolen laptop lasted indefinitely -- the
# security item Gabe's brief names as "sessions expire" was half-implemented.
#
# These two close it, and they are enforced by GoTrue rather than by anything
# this repo ships, which is the point: a timeout the client enforces is a
# timeout anyone can skip by not running the client.
#
#   timebox             a session is dead 24h after sign-in whatever happens.
#                       Long enough that an ordinary working day never hits it,
#                       short enough that a session is not a permanent key.
#   inactivity_timeout  8h with no activity ends it. Someone who closes the lid
#                       on Friday signs in again on Monday.
#
# THE CLIENT ALREADY HANDLES THE CONSEQUENCE. When a refresh is refused
# supabase-js emits SIGNED_OUT, and AuthContext turns that into an explicit
# "your session expired" dialog rather than a silent bounce to /login -- see
# `sessionExpired` there. Without that half, this half reads to the user as the
# app logging them out at random.
#
# COMMENTED OUT 2026-09-15: THIS IS A PAID FEATURE AND THE PUSH IS REJECTED.
#
#   unexpected status 402: {"message":"User sessions can only be configured
#   on Pro Plans and up."}
#
# The whole file is sent as one request, so this block did not merely fail --
# it took the Brevo SMTP switch, the new site_url, the 10-minute OTP expiry and
# the fixed redirect allow-list down with it. That is why it is commented
# rather than left to fail loudly: everything else here is free-tier and has to
# be able to land.
#
# WHAT THIS COSTS, STATED PLAINLY. Server-side session expiry is now NOT
# implemented. `jwt_expiry` still rotates the access token hourly, and refresh
# rotation still runs, but nothing ends a session on the server -- so a session
# on a shared or stolen laptop still lasts indefinitely. The security item
# "sessions expire" is back to half-done, and no amount of client code closes
# it, because a timeout the client enforces is one anyone can skip by not
# running the client.
#
# THE CLIENT HALF IS STILL WORTH HAVING and still runs. AuthContext's
# `sessionExpired` and SessionExpiredDialog handle a refusal from ANY cause --
# a revoked session, a password change elsewhere, a project restart, an admin
# sign-out. Those all still happen; they are just no longer joined by a clock.
#
# TO ENABLE: upgrade the project to Pro, uncomment, and
# `npm run push:auth-config` -- never `supabase config push` directly; see
# docs/SECURITY.md for why.
# [auth.sessions]
# # Force log out after the specified duration.
# timebox = "24h"
# # Force log out if the user has been inactive longer than the specified duration.
# inactivity_timeout = "8h"

# This hook runs before a new user is created and allows developers to reject the request based on the incoming user object.
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# This hook runs before a token is issued and allows you to add additional claims based on the authentication method used.
# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

# Configure one of the supported SMS providers: `twilio`, `twilio_verify`, `messagebird`, `textlocal`, `vonage`.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
# DO NOT commit your Twilio auth token to git. Use environment variable substitution instead:
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

# Multi-factor-authentication is available to Supabase Pro plan.
[auth.mfa]
# Control how many MFA factors can be enrolled at once per user.
max_enrolled_factors = 10

# Control MFA via App Authenticator (TOTP)
# TRUE, MATCHING THE LIVE PROJECT, and this line is the whole argument for
# diffing before pushing. The CLI generates these as `false`, the project has
# them ON, and `config push` sends the whole file -- so accepting the generated
# default would have silently turned off app-authenticator MFA for every user
# who had enrolled one, as a side effect of a change about email templates.
# Caught in the push diff on 2026-09-03.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Configure MFA via Phone Messaging
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# Configure MFA via WebAuthn
# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

# Use an external OAuth provider. The full list of providers are: `apple`, `azure`, `bitbucket`,
# `discord`, `facebook`, `github`, `gitlab`, `google`, `keycloak`, `linkedin_oidc`, `notion`, `twitch`,
# `twitter`, `x`, `slack`, `spotify`, `workos`, `zoom`.
[auth.external.apple]
enabled = false
client_id = ""
# DO NOT commit your OAuth provider secret to git. Use environment variable substitution instead:
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
# Overrides the default auth callback URL derived from auth.external_url.
redirect_uri = ""
# Overrides the default auth provider URL. Used to support self-hosted gitlab, single-tenant Azure,
# or any other third-party OIDC providers.
url = ""
# If enabled, the nonce check will be skipped. Required for local sign in with Google auth.
skip_nonce_check = false
# If enabled, it will allow the user to successfully authenticate when the provider does not return an email address.
email_optional = false

# Allow Solana wallet holders to sign in to your project via the Sign in with Solana (SIWS, EIP-4361) standard.
# You can configure "web3" rate limit in the [auth.rate_limit] section and set up [auth.captcha] if self-hosting.
[auth.web3.solana]
enabled = false

# Use Firebase Auth as a third-party provider alongside Supabase Auth.
[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

# Use Auth0 as a third-party provider alongside Supabase Auth.
[auth.third_party.auth0]
enabled = false
# tenant = "my-auth0-tenant"
# tenant_region = "us"

# Use AWS Cognito (Amplify) as a third-party provider alongside Supabase Auth.
[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

# Use Clerk as a third-party provider alongside Supabase Auth.
[auth.third_party.clerk]
enabled = false
# Obtain from https://clerk.com/setup/supabase
# domain = "example.clerk.accounts.dev"

# OAuth server configuration
[auth.oauth_server]
# Enable OAuth server functionality
enabled = false
# Path for OAuth consent flow UI
authorization_url_path = "/oauth/consent"
# Allow dynamic client registration
allow_dynamic_registration = false

[edge_runtime]
enabled = true
# Supported request policies: `oneshot`, `per_worker`.
# `per_worker` (default) — enables hot reload during local development.
# `oneshot` — fallback mode if hot reload causes issues (e.g. in large repos or with symlinks).
policy = "per_worker"
# Port to attach the Chrome inspector for debugging edge functions.
inspector_port = 8083
# The Deno major version to use.
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54327
# Configure one of the supported backends: `postgres`, `bigquery`.
backend = "postgres"

# Experimental features may be deprecated any time
[experimental]
# Configures Postgres storage engine to use OrioleDB (S3)
orioledb_version = ""
# Configures S3 bucket URL, eg. <bucket_name>.s3-<region>.amazonaws.com
s3_host = "env(S3_HOST)"
# Configures S3 bucket region, eg. us-east-1
s3_region = "env(S3_REGION)"
# Configures AWS_ACCESS_KEY_ID for S3 bucket
s3_access_key = "env(S3_ACCESS_KEY)"
# Configures AWS_SECRET_ACCESS_KEY for S3 bucket
s3_secret_key = "env(S3_SECRET_KEY)"

# [experimental.pgdelta]
# When enabled, pg-delta becomes the active engine for supported schema flows.
# enabled = false
# Directory under `supabase/` where declarative files are written.
# declarative_schema_path = "./database"
# JSON string passed through to pg-delta SQL formatting.
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":80,\"commaStyle\":\"trailing\"}"
