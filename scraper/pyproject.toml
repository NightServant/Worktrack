[project]
name = "worktrack-extractor"
version = "0.1.0"
description = "Job posting extraction for Worktrack's Auto-fill button."
requires-python = ">=3.12"

# PINNED EXACTLY, and that is the mitigation for the one real risk in choosing
# Scrapling: it is 0.4.15, pre-1.0, and its API can move. The other half of the
# mitigation is the boundary in extractor/core.py -- Scrapling types never
# leave that module, so an upgrade is a diff in one file rather than a hunt.
#
# THE BROWSER IS OPTIONAL AGAIN, and Firecrawl is why.
#
# This note has now been written three ways in two days, so here is the whole
# arc. It first said the browser fetchers were hundreds of MB for a browser
# this lane never opens. Then two of the sites Gabe actually applies through
# turned out to be unreadable without one -- Cloudstaff renders its postings
# with JavaScript, JobStreet answers a raw fetch with a challenge -- so they
# became required. Then the deployment proved that wrong in the other
# direction: `playwright` installs on Vercel and its Chromium NEVER DOES,
# because the Python builder runs no post-install step. Rendering worked
# locally and nowhere that mattered, while production carried ~300MB it could
# not use.
#
# Firecrawl is a hosted fetch. It needs no binary, so it works in the place the
# browser could not, and the browser goes back to being a local convenience:
# `_render` imports it inside a try/except and simply returns None when it is
# absent. Install it with `pip install -e './scraper[dev,browser]'` if you want
# JavaScript rendering without a Firecrawl key on your own machine.
dependencies = [
  "scrapling==0.4.15",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # The roles rail's Indeed half. MIT, and it pulls pandas, numpy and
  # tls_client -- which is why `app.py` imports it inside the one function that
  # uses it rather than at module scope. What adopting it costs, beyond the
  # weight, is set out in extractor/jobspy_board.py and README section 12.
  "python-jobspy>=1.1.82",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
# Local-only. Never installed in a deployment -- see the note above.
browser = ["scrapling[fetchers]==0.4.15", "playwright>=1.40"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
